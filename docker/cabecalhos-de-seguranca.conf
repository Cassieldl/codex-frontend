# Cabeçalhos de segurança do portal, incluídos em cada `location` do template. `add_header` não é
# herdado: um único `add_header` dentro de um `location` descarta todos os do nível `server`, por
# isso este arquivo é incluído em cada bloco em vez de declarado uma vez no `server`. Com `always`
# eles saem também nas respostas de erro (404, 500).
#
# HSTS sai daqui mesmo com o TLS terminando no balanceador: o navegador só o aceita em resposta
# HTTPS, então em HTTP local ele é ignorado. Sem `includeSubDomains`: o portal não decide pelos
# outros hosts do domínio.
#
# `X-Frame-Options` é `SAMEORIGIN`, nunca `DENY`: o keycloak-js carrega `/silent-check-sso.html`
# num iframe do próprio portal. Ele só cobre navegador antigo; o atual segue o `frame-ancestors`.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy $csp always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
