name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` e não `npm install`: instala exatamente o que está no lock e falha se o lock
      # divergir do package.json, em vez de resolver versões novas em silêncio.
      - name: Instalar dependências
        run: npm ci

      # `npm run build` é `tsc -b && vite build`. O typecheck tem de ser ESTE comando: nesta raiz
      # `tsc --noEmit` lê um tsconfig com `files: []`, checa ZERO arquivo e sai 0 sempre — já
      # custou uma demanda inteira de gate inerte neste projeto.
      - name: Typecheck e build
        run: npm run build

      # Depende do step acima, e não por estilo: `src/routeTree.gen.ts` é GERADO (pelo `prebuild`)
      # e não é versionado, e há teste que o importa. Num clone limpo, rodar os testes primeiro
      # falha por arquivo ausente — o que parece defeito de código e é ordem de step.
      - name: Testes
        run: npm test

      # Só dependências de produção: as de desenvolvimento (ambiente de teste) não vão para o
      # bundle. `high` para cima reprova.
      - name: Dependências de produção sem vulnerabilidade alta
        run: npm audit --omit=dev --audit-level=high

  imagem:
    # Constrói a imagem e sobe o container de verdade: a configuração do nginx só é validada na
    # partida, e uma variável de template ausente já derrubaria o portal em produção.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem do portal
        run: |
          docker build -t codex-portal:ci \
            --build-arg VITE_API_URL=https://api.exemplo.com.br/api/v1 \
            --build-arg VITE_KEYCLOAK_URL=https://auth.exemplo.com.br \
            --build-arg VITE_KEYCLOAK_REALM=codex \
            --build-arg VITE_KEYCLOAK_CLIENT_ID=codex-front .

      - name: Subir o container e responder
        run: |
          docker run -d --name portal -p 8080:8080 \
            -e CSP_CONNECT_SRC="https://api.exemplo.com.br https://auth.exemplo.com.br" \
            -e CSP_FRAME_SRC="https://auth.exemplo.com.br" codex-portal:ci
          for tentativa in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8080/provedores
          curl -sfI http://localhost:8080/ | grep -qi '^strict-transport-security:'
          curl -sf http://localhost:8080/robots.txt | grep -q 'Disallow: /interno'

      - name: Recusar subir sem as variáveis da CSP
        run: |
          docker run -d --name portal-incompleto -e CSP_CONNECT_SRC="https://api.exemplo.com.br" codex-portal:ci
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' portal-incompleto)" = "false"
          docker logs portal-incompleto 2>&1 | grep -q 'CSP_FRAME_SRC'
